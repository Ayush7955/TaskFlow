name: CI

on:
  push:
    branches: [develop, main, 'feature/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run ESLint
        run: npm run lint
        working-directory: server

      - name: Check Prettier formatting
        run: npm run format:check
        working-directory: server

  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run unit tests
        run: npx jest tests/unit tests/security/uploadSpoof.test.js --no-coverage --forceExit
        working-directory: server
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: server/coverage/

  # ─── Integration Tests ──────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: taskflow_test
          MYSQL_USER: taskflow
          MYSQL_PASSWORD: taskflow_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -u taskflow -ptaskflow_pass --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Run migrations
        run: npx sequelize-cli db:migrate
        working-directory: server
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: taskflow_test
          DB_USER: taskflow
          DB_PASSWORD: taskflow_pass
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars

      - name: Run integration tests
        run: npx jest tests/integration --forceExit --detectOpenHandles
        working-directory: server
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: taskflow_test
          DB_USER: taskflow
          DB_PASSWORD: taskflow_pass
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars

  # ─── Build Docker Image ──────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push on develop)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: taskflow-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
